<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진담중국어 게임 놀이터</title>
<meta name="description" content="진담중국어 게임 모음 · 아이들이 골라서 하는 중국어 학습 게임">
<meta name="theme-color" content="#fff6e6">
<link rel="icon" href="icons/app-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="진담 놀이터">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a1a1f;
    --paper: #fff9ef;
    --cream: #fff1d6;
    --bg: #fff6e6;
    --gold: #f2c14e;
    --red: #e2504c;
    --jade: #2f9a7a;
    --mute: #7a6a62;
    --f: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f);
    -webkit-text-size-adjust: 100%;
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    overflow-x: hidden;
  }
  /* 배경: 흐릿하게 떠다니는 한자 */
  .bg-hanzi { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-hanzi span {
    position: absolute; font-size: 64px; color: var(--gold); opacity: .18;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 700;
    animation: drift 14s ease-in-out infinite;
  }
  @keyframes drift { 50% { transform: translateY(-14px) rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .bg-hanzi span, .card { animation: none !important; } }

  main { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; }
  header { text-align: center; margin: 8px 0 22px; }
  .logo {
    width: 76px; height: 76px; border-radius: 20px; border: 4px solid var(--ink);
    box-shadow: 0 5px 0 var(--ink); image-rendering: pixelated; background: #fff;
  }
  h1 {
    margin: 12px 0 4px; font-weight: 400; font-size: clamp(30px, 7vw, 46px); letter-spacing: -.5px;
  }
  h1 .zh { color: var(--red); }
  .hello { margin: 0; color: var(--mute); font-size: clamp(16px, 3.6vw, 20px); }

  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 10px;
    background: var(--paper); border: 4px solid var(--ink); border-radius: 18px;
    box-shadow: 0 7px 0 var(--ink); padding: 18px 18px 16px;
    color: inherit; text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
    animation: pop .5s ease both;
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 0 var(--ink); }
  .card:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .card:focus-visible { outline: 4px solid var(--jade); outline-offset: 4px; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .card.star { background: #fff3c9; }
  .top { display: flex; align-items: center; gap: 14px; }
  .icon {
    width: 72px; height: 72px; flex: none; border-radius: 16px; border: 3px solid var(--ink);
    image-rendering: pixelated; background: #fff;
  }
  .name { margin: 0; font-weight: 400; font-size: 23px; line-height: 1.2; }
  h3.name { font-size: 22px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag {
    font-size: 13px; padding: 2px 9px; border-radius: 999px; border: 2px solid var(--ink);
    background: #fff;
  }
  .tag.kids { background: var(--gold); }
  .tag.hsk { background: #d8f0e4; }
  .desc { margin: 0; font-size: 16.5px; line-height: 1.45; color: #4a3a3f; min-height: 48px; }
  .go {
    align-self: stretch; text-align: center; margin-top: 2px;
    background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: 0 4px 0 var(--ink); padding: 9px 0; font-size: 20px;
  }
  .card.star .go { background: var(--jade); }
  .badge {
    position: absolute; top: -14px; right: 14px; background: var(--gold); border: 3px solid var(--ink);
    border-radius: 10px; padding: 2px 10px; font-size: 14px; box-shadow: 0 3px 0 var(--ink);
  }
  .cats { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: -6px 0 22px; }
  .cats a {
    text-decoration: none; color: var(--ink); background: #fff; border: 3px solid var(--ink);
    border-radius: 999px; padding: 6px 16px; font-size: 17px; box-shadow: 0 3px 0 var(--ink);
  }
  .cats a:active { transform: translateY(3px); box-shadow: none; }
  .cat { margin: 0 0 30px; scroll-margin-top: 16px; }
  .cat-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 4px 16px; }
  .cat-head h2 { margin: 0; font-weight: 400; font-size: 26px; }
  .cat-head h2::before {
    content: ''; display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 3px solid var(--ink);
    margin-right: 8px; vertical-align: 1px; background: var(--c, var(--gold));
  }
  .cat-head p { margin: 0; color: var(--mute); font-size: 16px; }
  footer { margin-top: 30px; text-align: center; color: var(--mute); font-size: 14px; line-height: 1.7; }
  footer b { color: var(--ink); font-weight: 400; }
</style>
</head>
<body>
  <div class="bg-hanzi" aria-hidden="true">
    <span style="left:4%;top:12%">中</span>
    <span style="left:86%;top:8%;animation-delay:-3s">学</span>
    <span style="left:12%;top:72%;animation-delay:-6s">玩</span>
    <span style="left:80%;top:64%;animation-delay:-9s">好</span>
    <span style="left:46%;top:88%;animation-delay:-2s">字</span>
  </div>

  <main>
    <header>
      <img class="logo" src="icons/app-192.png" alt="">
      <h1>진담중국어 <span class="zh">게임 놀이터</span></h1>
      <p class="hello">오늘은 어떤 게임으로 중국어를 만나 볼까?</p>
    </header>

    <nav class="cats" aria-label="종류">
      <a href="#kids">초등 친구들</a>
      <a href="#write">한자 쓰기</a>
      <a href="#hsk">HSK 단어 게임</a>
    </nav>

    <div id="games"></div>

    <footer>
      게임 기록은 지금 쓰는 기기에 저장돼요. 같은 기기·같은 브라우저로 들어오면 이어서 할 수 있어요.<br>
      <b>© 2026 진담중국어</b> · 모든 게임과 자료의 저작권은 진담중국어에 있어요.
    </footer>
  </main>
<script>
  // 게임 목록: 새 게임은 여기 한 줄만 추가하면 돼요 (아이콘은 icons/ 폴더에)
  var CATS = [
    { id: 'kids', name: '초등 친구들', note: '교과서·우리 동네 한자어로 중국어와 친해져요', color: '#f2c14e', games: [
      { name: '덩어리 숲속의 모험(그랑힐스)', url: 'https://jindamchineseadventure.vercel.app/kids', icon: 'adventure', tags: ['초등', '한자어', '병음 함께'], desc: '학교·생일·우리 동네 한자어를 모으며 대나무숲을 달려요.', star: '우리 반' },
      { name: '한자어 탐정', url: 'https://jindamdetectivestudent.vercel.app/', icon: 'detective', tags: ['초등 저학년', '한자어', '탐정'], desc: '우리말 속 한자를 찾으면 중국어가 툭! 사건을 풀고 도장을 모아요.' },
      { name: '진담 한자어 놀이터', url: 'https://jindamhanzistudyfor-students.vercel.app/', icon: 'hanzistudy', tags: ['초등', '교과서 한자어', '매주 새로'], desc: '교과서 속 한자어를 쪼개 보고, 따라 쓰고, 중국어 소리까지 들어요.' },
    ] },
    { id: 'write', name: '한자 쓰기', note: '획순대로 따라 쓰며 한자를 손으로 익혀요', color: '#e2504c', games: [
      { name: '진담한자톡', url: 'https://jindamhanzitalk.vercel.app/', icon: 'hanzitalk', tags: ['부수', '한자 쓰기'], desc: '부수로 배우는 한자 쓰기 게임이에요.' },
      { name: '진담 HSK4 한자톡', url: 'https://jindamhanzitalkhsk4.vercel.app/', icon: 'hanzitalk4', tags: ['HSK 4급', '필수 어휘 1000', '쓰기'], desc: 'HSK 4급 필수 어휘를 직접 써 보며 익혀요.' },
    ] },
    { id: 'hsk', name: 'HSK 단어 게임', note: '짝꿍어휘와 HSK 단어로 모험하고 퍼즐을 풀어요', color: '#2f9a7a', games: [
      { name: '덩어리 숲속의 모험', url: 'https://jindamchineseadventure.vercel.app/', icon: 'adventure', tags: ['HSK 4급', '짝꿍어휘', '모험'], desc: '진담이와 숲을 탐험하며 짝꿍어휘를 모으고 숲의 보스를 물리쳐요.' },
      { name: '덩어리 숲', url: 'https://jindamforeststudenthsk30.vercel.app/', icon: 'forest', tags: ['HSK 3.0', '짝꿍어휘', '캐릭터 키우기'], desc: 'HSK 단어와 짝꿍어휘를 익히며 나만의 캐릭터를 키워요.' },
      { name: '진담점프', url: 'https://jindamjump.vercel.app/', icon: 'jump', tags: ['HSK', '듣기', '점프'], desc: '용암을 피해 위로 점프! 중국어를 듣고 뜻을 골라요.' },
      { name: '진담 테트리스', url: 'https://jindamtetrisnew.vercel.app/', icon: 'tetris', tags: ['HSK 4~6급', '단어', '블록'], desc: '단어를 블록처럼 쌓고 짝꿍어휘로 터뜨려요.' },
      { name: '진담 블록퍼즐', url: 'https://jindamblockpuzzle.vercel.app/', icon: 'puzzle', tags: ['HSK', '퀴즈', '퍼즐'], desc: '단어 퀴즈를 풀고 블록 퍼즐을 맞춰요.' },
    ] },
  ];
  (function () {
    function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    var html = '';
    var n = 0;
    CATS.forEach(function (c) {
      html += '<section class="cat" id="' + c.id + '" style="--c:' + c.color + '"><div class="cat-head"><h2>' + esc(c.name) + '</h2><p>' + esc(c.note) + '</p></div><div class="grid">';
      c.games.forEach(function (g) {
        var tags = g.tags.map(function (t, i) { return '<span class="tag' + (i === 0 ? (c.id === 'kids' ? ' kids' : ' hsk') : '') + '">' + esc(t) + '</span>'; }).join('');
        html += '<a class="card' + (g.star ? ' star' : '') + '" href="' + g.url + '" style="animation-delay:' + (0.04 * n++).toFixed(2) + 's">' +
          (g.star ? '<span class="badge">' + esc(g.star) + '</span>' : '') +
          '<div class="top"><img class="icon" src="icons/' + g.icon + '.png" alt=""><div><h3 class="name">' + esc(g.name) + '</h3><div class="tags">' + tags + '</div></div></div>' +
          '<p class="desc">' + esc(g.desc) + '</p><span class="go">시작!</span></a>';
      });
      html += '</div></section>';
    });
    document.getElementById('games').innerHTML = html;
  })();
</script>
</body>
</html>
